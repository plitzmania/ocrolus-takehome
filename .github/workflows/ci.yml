name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[test]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  review-desk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-desk-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: review-desk-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
